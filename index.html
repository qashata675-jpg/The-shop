<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg,#10152e,#25104a,#063b50);
      min-height: 100vh;
    }
    header {
      padding: 25px;
      text-align: center;
      background: #ffffff12;
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 42px; margin: 5px; }
    .hero { text-align: center; padding: 65px 20px; }
    .hero h2 { font-size: 34px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 20px;
      padding: 25px;
    }
    .product {
      background: #ffffff16;
      border: 1px solid #ffffff30;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
    }
    button {
      background: #00d9ff;
      color: #10152e;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header><h1>THE SHOP</h1>Handmade • Made with creativity</header>
  <section class="hero">
    <h2>Made by us. Made for you.</h2>
    <p>Открий нашите ръчно изработени продукти.</p>
  </section>
  <main class="products">
    <article class="product">
      <h2>Нашият първи продукт</h2>
      <p>Скоро ще представим първото си handmade изделие!</p>
      <button>Очаквайте скоро</button>
    </article>
  </main>
</body>
</html>
